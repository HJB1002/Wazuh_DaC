name: Check Rule XML Syntax

on:
  pull_request:
    branches: ["main"]
    paths:
      - "rules/**.xml"   # Chạy khi có file XML trong rules/ được thêm, sửa hoặc xoá

jobs:
  check-xml-syntax:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Fetch base branch
        run: git fetch origin "${{ github.base_ref }}"

      - name: Run rule XML syntax checker
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 .github/scripts/check_rule_xml_syntax.py